<style>
:root{--c:#f59e0b;--c-2:#fbbf24;--c-grad:linear-gradient(90deg,var(--c),var(--c-2));--bg:#07070d;--tp:#f0eeff;--ts:#8a8aa3;--tm:#4b4b62;--border:rgba(255,255,255,.06);--syntax-grad:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tp);font-family:Cairo,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap{position:relative}
#deck{width:1100px;height:619px;position:absolute;top:0;left:0;transform-origin:top left;background:#0b0b14;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.slide{position:absolute;inset:0;padding:30px 48px 18px;display:none;flex-direction:column}
.slide.on{display:flex}.slide{--c-grad:linear-gradient(90deg,var(--c),var(--c-2))}
.c1{--c:#ec4899;--c-2:#a855f7}.c2{--c:#6366f1;--c-2:#8b5cf6}.c3{--c:#f59e0b;--c-2:#fbbf24}.c4{--c:#22d3ee;--c-2:#06b6d4}.c5{--c:#10b981;--c-2:#34d399}
.slide.on>*{animation:ru .6s both}
@keyframes ru{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lbl{color:var(--c);font-weight:700;font-size:15px;letter-spacing:.5px}
h2{margin:2px 0 0;font-size:40px;font-weight:900;line-height:1.3}
h2 em{font-style:normal;background:var(--c-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ts);font-size:18px;margin:2px 0 0}
.stage{flex:1;margin:10px 0 8px;min-height:0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.sf{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tm)}
.sf span:last-child{color:var(--ts)}
.pd{display:flex;gap:6px}.pd i{width:7px;height:7px;border-radius:50%;background:var(--tm)}.pd i.a{background:var(--c);width:20px;border-radius:4px}
.sub.hid{visibility:hidden}
#ov{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}
#ov.on{pointer-events:auto;cursor:crosshair}
#nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:8px;max-width:1100px;color:var(--ts);font-size:14px}
#nav button{background:#15151f;color:var(--tp);border:1px solid var(--border);border-radius:10px;padding:5px 12px;font:inherit;cursor:pointer}
#nav button.on{border-color:#fbbf24;background:#2a2410}
.swc{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 3px;border:2px solid transparent;cursor:pointer;vertical-align:middle}
.swc.on{border-color:#fff}
</style>
</head>

function step(m){const d=D[cur],T=d.st.length,sb=d.el.querySelector('.sub');

 else if(m==2){d.st=d.st.map(v=>v==null?fr-999:v);sb.classList.remove('hid')}

function fitDeck(){const s=Math.min(innerWidth/1100,(innerHeight-$('nav').offsetHeight-24)/619),w=$('wrap');w.style.width=1100*s+'px';w.style.height=619*s+'px';deck.style.transform=`scale(${s})`}
addEventListener('resize',fitDeck);fitDeck();if(window.ResizeObserver)new ResizeObserver(fitDeck).observe(document.getElementById('nav'));if(document.fonts)document.fonts.ready.then(fitDeck);
const at=(f,a,b)=>Math.max(0,Math.min(1,(f-a)/(b-a))),ease=t=>t*t*(3-2*t);
function marker(x,pts,p,col){if(p<=0)return;const L=[];for(let i=1;i<pts.length;i++)L.push(Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));let R=L.reduce((a,b)=>a+b,0)*p;x.beginPath();x.moveTo(...pts[0]);for(let i=1;i<pts.length&&R>0;i++){const k=Math.min(1,R/L[i-1]);x.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k);R-=L[i-1]}x.strokeStyle=col;x.lineWidth=3;x.lineCap=x.lineJoin='round';x.shadowColor=col;x.shadowBlur=8;x.stroke();x.shadowBlur=0}
function board(x,W,H,f,t){x.fillStyle='#0a0a13';x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.06)';for(let i=14;i<W;i+=26)for(let j=14;j<H;j+=26)x.fillRect(i,j,1.5,1.5);const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#6366f1');g.addColorStop(.5,'#a855f7');g.addColorStop(1,'#ec4899');x.globalAlpha=.45+.3*Math.sin(f/40);x.strokeStyle=g;x.lineWidth=3;x.strokeRect(2,2,W-4,H-4);x.globalAlpha=1;x.font='500 14px Lemonada,Cairo,sans-serif';x.fillStyle='#8a8aa3';x.textAlign='right';x.direction='ltr';x.fillText(t,W-18,24)}
function txt(x,s,cx,cy,fs,col,mw,p,font){s=ar(s);const fn=z=>`${font=='m'?500:700} ${z}px ${font=='m'?'Lemonada,':''}Cairo,sans-serif`;x.font=fn(fs);while(x.measureText(s).width>mw&&fs>9){fs--;x.font=fn(fs)}const w=x.measureText(s).width,rtl=/[\u0600-\u06ff]/.test(s);x.fillStyle=col;x.textBaseline='middle';x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';x.fillText(s.slice(0,Math.ceil(s.length*p)),rtl?cx+w/2:cx-w/2,cy)}
function edge(a,b,g){const dx=b.x-a.x,dy=b.y-a.y,ux=Math.abs(dx)||1e-6,uy=Math.abs(dy)||1e-6,t1=Math.min(a.w/2/ux,a.h/2/uy),t2=Math.min(b.w/2/ux,b.h/2/uy),d=Math.hypot(dx,dy),k=g/d;return[[a.x+dx*t1+dx*k,a.y+dy*t1+dy*k],[b.x-dx*t2-dx*k,b.y-dy*t2-dy*k]]}
function draw(d,f){
 const cv=d.cv,r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
 if(cv.width!=W*r||cv.height!=H*r){cv.width=W*r;cv.height=H*r}
 const x=cv.getContext('2d');x.setTransform(r,0,0,r,0,0);
  const col=getComputedStyle(d.el).getPropertyValue('--c').trim();
 board(x,W,H,f,d.t);
 const N=d.n.map(n=>({x:n[0]/100*W,y:n[1]/100*H+8,w:n[2]/100*W,h:n[3]/100*H,l:n[4],s:n[5]?n[5].split('|'):[]}));
 const U=i=>d.st[i]==null?-1:f-d.st[i];
 N.forEach((n,i)=>{const u=U(i);if(u<0)return;const p=at(u,0,30),X=n.x-n.w/2,Y=n.y-n.h/2;x.save();x.globalAlpha=p>=1?.08+.03*Math.sin(f/25):0;x.fillStyle=col;x.fillRect(X,Y,n.w,n.h);x.restore();marker(x,[[X,Y],[X+n.w,Y],[X+n.w,Y+n.h],[X,Y+n.h],[X,Y]],ease(p),col)});
 d.a.forEach(a=>{const u=U(Math.max(a[0],a[1]));if(u<0)return;const p=ease(at(u,25,55)),[s,e]=edge(N[a[0]],N[a[1]],7);marker(x,[s,e],p,col);if(p>=1){const an=Math.atan2(e[1]-s[1],e[0]-s[0]);x.beginPath();for(const o of[2.6,-2.6])x.lineTo(e[0]+Math.cos(an+o)*11,e[1]+Math.sin(an+o)*11),x.lineTo(e[0],e[1]);x.strokeStyle=col;x.lineWidth=3;x.stroke()}});
 N.forEach((n,i)=>{const u=U(i);if(u<0)return;const fs=Math.min(H*.062,n.h>H*.3?27:22),fs2=fs*.66,lh=fs*1.4,lh2=fs2*1.5,tot=lh+n.s.length*lh2,y0=n.y-tot/2+lh/2;
  txt(x,n.l,n.x,y0,fs,'#eef0ff',n.w*.9,at(u,15,45),'m');
  n.s.forEach((t,j)=>{x.save();x.globalAlpha=ease(at(u,40+j*8,60+j*8));txt(x,t,n.x,y0+lh/2+lh2*(j+.6),fs2,'#a9a9c4',n.w*.9,1);x.restore()})});
}
(function loop(){draw(D[cur],fr++);requestAnimationFrame(loop)})();
go(0);
