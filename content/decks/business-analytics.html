body{display:flex;flex-direction:column;align-items:center;justify-content:center}

.lbl{color:var(--c);font-weight:900;font-size:16px}
h2{margin:2px 0 0;font:700 44px/1.3 'Aref Ruqaa',Cairo,sans-serif}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 6px}
.sub{color:var(--ts);font-size:18px;margin:2px 0 0}
.sub.hid{visibility:hidden}
.stage{flex:1;margin:10px 0 8px;min-height:0;border:2px solid rgba(30,40,90,.15);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(60,40,0,.18)}
canvas{width:100%;height:100%;display:block}
.sf{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tm)}
.sf span:last-child{color:var(--ts)}
.pd{display:flex;gap:6px}.pd i{width:7px;height:7px;border-radius:50%;background:#cfc6ab}.pd i.a{background:var(--c);width:20px;border-radius:4px}
#ov{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}
#ov.on{pointer-events:auto;cursor:crosshair}
#nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:8px;max-width:1100px;color:#d8d0bd;font-size:14px}
#nav button{background:#fbf6e6;color:#1b2340;border:1px solid rgba(0,0,0,.2);border-radius:10px;padding:5px 12px;font:inherit;cursor:pointer}
#nav button.on{border-color:#2563eb;background:#dbeafe}
.swc{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 3px;border:2px solid transparent;cursor:pointer;vertical-align:middle}
.swc.on{border-color:#fff}
