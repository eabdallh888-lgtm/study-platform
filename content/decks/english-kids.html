.sub{color:var(--ts);font-size:18px;margin:2px 0 0}

#ov.on{pointer-events:auto;cursor:crosshair}
#nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:8px;max-width:1100px;color:#d8d0bd;font-size:14px}
#nav button{background:#fbf6e6;color:#1b2340;border:1px solid rgba(0,0,0,.2);border-radius:10px;padding:5px 12px;font:inherit;cursor:pointer}
#nav button.on{border-color:#2563eb;background:#dbeafe}
.swc{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 3px;border:2px solid transparent;cursor:pointer;vertical-align:middle}
.swc.on{border-color:#fff}
