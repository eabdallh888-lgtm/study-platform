<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أنظمة العد والتحويلات — الكشكول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--c:#e11d48;--hl:#fecdd3;--tp:#1b2340;--ts:#5b5f77;--tm:#a3a5b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#3b352e;color:var(--tp);font-family:Cairo,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap{position:relative}
#deck{width:1100px;height:619px;position:absolute;top:0;left:0;transform-origin:top left;background:#f4ecd6;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#wm{position:absolute;inset:0;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:center;font:900 230px Cairo,sans-serif;letter-spacing:20px;color:rgba(30,50,120,.07);transform:rotate(-24deg);direction:ltr}
.slide{position:absolute;inset:0;padding:30px 48px 18px;display:none;flex-direction:column}
.slide.on{display:flex}
.c1{--c:#e11d48;--hl:#fecdd3}.c2{--c:#2563eb;--hl:#bfdbfe}.c3{--c:#d97706;--hl:#fde68a}.c4{--c:#059669;--hl:#a7f3d0}.c5{--c:#7c3aed;--hl:#ddd6fe}
.slide.on>*{animation:ru .6s both}
@keyframes ru{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lbl{color:var(--c);font-weight:900;font-size:16px}
h2{margin:2px 0 0;font:700 44px/1.3 'Aref Ruqaa',Cairo,sans-serif}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 6px}
.sub{color:var(--ts);font-size:18px;margin:2px 0 0}
.sub.hid{visibility:hidden}
.stage{flex:1;margin:10px 0 8px;min-height:0;border:2px solid rgba(30,40,90,.15);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(60,40,0,.18)}
canvas{width:100%;height:100%;display:block}
.sf{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tm)}
.sf span:last-child{color:var(--ts)}
.pd{display:flex;gap:6px}.pd i{width:7px;height:7px;border-radius:50%;background:#cfc6ab}.pd i.a{background:var(--c);width:20px;border-radius:4px}
#ov{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;touch-action:none}
#ov.on{pointer-events:auto;cursor:crosshair}
#nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:8px;max-width:1100px;color:#d8d0bd;font-size:14px}
#nav button{background:#fbf6e6;color:#1b2340;border:1px solid rgba(0,0,0,.2);border-radius:10px;padding:5px 12px;font:inherit;cursor:pointer}
#nav button.on{border-color:#2563eb;background:#dbeafe}
.swc{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 3px;border:2px solid transparent;cursor:pointer;vertical-align:middle}
.swc.on{border-color:#fff}
</style>
</head>
